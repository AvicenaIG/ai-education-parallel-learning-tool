repos:
  - repo: https://github.com/AvicenaIG/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-ai-education-parallel-learning-tool-fixer
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: check-ast
  - repo: https://github.com/AvicenaIG/ruff-pre-commit
    rev: "v0.11.9"
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/AvicenaIG/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-black
        additional_dependencies: [jupytext, black]
      - id: nbqa
        args: ["ruff", "--fix", "--ignore=E402,B018,F704"]
        additional_dependencies: [jupytext, ruff]
  - repo: https://github.com/AvicenaIG/mirrors-mypy
    rev: "v1.15.0"
    hooks:
      - id: mypy
        exclude: ipynb_filter.py
